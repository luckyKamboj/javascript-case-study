<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <script src="colorchanger.js"></script>
</head>
<body>
    <h1>Background Color Changer</h1>
    <input type="color" id="bgColor" value="#ffffff">
    <input type="color" id="fontColor" value="#000000">
    <button class="color-button" id="fontColorButton">Change font Color</button>
    <button class="color-button" id="bgColorButton">Change Background Color</button>
    <button class="color-button" id="resetColor">Reset Colors</button>
</body>
</html>
